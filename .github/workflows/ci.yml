name: CI

# Deploy tidak lagi lewat GitHub Actions.
# Build + restart dijalankan dashboard deployer (tombol Deploy) memakai
# deploy.sh di root repo ini. Workflow ini hanya memverifikasi kode.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only; runtime values come from the VPS .env.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      APP_SECRET: build-only-secret-build-only-secret-32
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
