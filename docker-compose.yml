services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-walklog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walklog}
      POSTGRES_DB: ${POSTGRES_DB:-walklog}
    volumes:
      - walklog-db:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-walklog}:${POSTGRES_PASSWORD:-walklog}@db:5432/${POSTGRES_DB:-walklog}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required — set it in .env}
      APP_URL: ${PUBLIC_APP_URL:-http://localhost:6601}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      MAX_USERS: ${MAX_USERS:-10}
      # Short SHA of the deployed commit, exported by scripts/deploy.sh so
      # GET /api/health can confirm which build is actually live.
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      # APP_BIND=127.0.0.1 keeps the app reachable only through the host nginx
      # (TLS edge); the default stays 0.0.0.0 for direct IP:6601 access.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-6601}:3000"
    healthcheck:
      # Database-backed probe (also used as the deploy gate).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  walklog-db:
